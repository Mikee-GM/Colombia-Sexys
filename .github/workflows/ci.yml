name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0

      - uses: actions/setup-node@v4
        with:
          # Misma version que el runner de produccion (Dockerfile: node:22-alpine).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build

      - name: Validar Docker Compose
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp catalogo-cs/.env.example catalogo-cs/.env.local
          docker compose config --quiet
