name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.0

      - uses: actions/setup-node@v5
        with:
          # Misma version que el runner de produccion (Dockerfile: node:22-alpine).
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
      - run: pnpm run build 2>&1 | tee build_log.txt
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Validar Docker Compose
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp catalogo-cs/.env.example catalogo-cs/.env.local
          docker compose config --quiet
